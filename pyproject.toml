[tool.poetry]
name = "tendero-ia"
version = "0.1.0"
description = "Asistente IA para restaurantes"
authors = ["Deiwin Monsalve"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0.3"
flask-sqlalchemy = "^3.1.1"
python-dotenv = "^1.0.1"
google-genai = "*"
pydantic = "^2.8.2"
requests = "^2.32.3"
gunicorn = "^22.0.0"
psycopg2-binary = "^2.9.9"
psycopg = { extras = ["binary"], version = "^3.1.0" }
reportlab = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
